version: '3.8'

services:
  db:
    image: postgres:16.8
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
    environment:
      POSTGRES_DB: cetech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red_swarm

  app:
    image: quesito/cn2-agendatec:latest
    deploy:
      replicas: 1
    ports:
      - "5010:5000"
    environment:
      - DATABASE_URL=postgresql://cetech_8wv5_user:DrB9cbuOFUgJNM4mv4NywPrczj6lXiHv@dpg-dbqea6gae00c73858t9g-a.oregon-postgres.render.com/cetech_8wv5
    networks:
      - red_swarm
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  red_swarm:
    external: true