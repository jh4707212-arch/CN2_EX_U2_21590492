
version: '3.8'

services:
  db:
    image: postgres:16.8
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
    environment:
      POSTGRES_DB: cetech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red_swarm

  app:
    image: quesito/cn2-agendatec:latest
    deploy:
      replicas: 1
    ports:
      - "5020:5000"
    environment:
      DATABASE_URL: postgresql://postgres:admin1234@db:5432/cetech
    networks:
      - red_swarm
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  red_swarm:
    external: true
